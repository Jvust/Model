name: ci

on:
  pull_request:
  push:
    branches:
      - "feat/**"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: python -m py_compile runtime/local_bridge.py runtime/backends.py runtime/drive_cache.py runtime/hardware.py runtime/image_runtime.py runtime/package_runtime.py runtime/task_runtime.py runtime/video_runtime.py runtime/edit_runtime.py runtime/edit_worker.py

      - name: Run bridge unit tests
        run: python -m unittest discover -s tests -v

      - name: Check JavaScript syntax
        run: |
          node --check assets/config.js
          node --check assets/model-index.js
          node --check assets/model-capabilities.js
          node --check assets/drive-client.js
          node --check assets/app.js
          node --check assets/workspaces.js
          node --check assets/image-edit.js
          node --check assets/library-controls.js
          node --check assets/video-controls.js
          node --check sw.js
          node --check workers/drive-oauth-bridge.mjs
          node tests/test_model_index.js
          node tests/test_model_capabilities.js
          node tests/test_image_edit.js
          node tests/test_drive_client.js
          node tests/test_video_controls.js
          node tests/test_library_controls.js

      - name: Verify Google API website contract
        run: |
          test -f index.html
          test -f .github/workflows/pages.yml
          test -f governance/PROJECT_STATE.md
          test -f governance/ARCHITECTURE.md
          test -f runtime/Model.cmd
          test -f runtime/launch_model.ps1
          test -f runtime/Install.cmd
          test -f runtime/install_runtime.ps1
          test -f runtime/background.ps1
          test -f runtime/Uninstall.cmd
          test -f runtime/uninstall_runtime.ps1
          grep -q 'oauthBridge' assets/config.js
          grep -q 'preferredFolderName' assets/config.js
          grep -q 'findFolderByName' assets/drive-client.js
          grep -q 'AI-Model-Vault' index.html
          grep -q 'findVaultBtn' index.html
          grep -q 'installRuntimeBtn' index.html
          grep -q 'scheduleRuntimeReconnect' assets/app.js
          grep -q '/v1/chat/completions' assets/app.js
          grep -q '/v1/drive/session' runtime/local_bridge.py
          grep -q 'DriveCache' runtime/local_bridge.py
          grep -q 'MODEL_CACHE_ROOT' runtime/launch_model.ps1
          grep -q 'JvustModelRuntime' runtime/install_runtime.ps1
          grep -q 'CurrentVersion\\Run' runtime/install_runtime.ps1
          if grep -q 'MODEL_DRIVE_ROOT' runtime/launch_model.ps1; then exit 1; fi
          grep -q '/v1/backends' runtime/local_bridge.py
          grep -q '/v1/models/plan' runtime/local_bridge.py
          grep -q '/v1/video/generate' runtime/local_bridge.py
          grep -q '/v1/video/status' runtime/local_bridge.py
          grep -q '/v1/tasks/start' runtime/local_bridge.py
          grep -q '/v1/tasks/embeddings' runtime/local_bridge.py
          grep -q '/v1/tasks/rerank' runtime/local_bridge.py
          grep -q '/v1/packages/materialize' runtime/local_bridge.py
          grep -q 'isPackageSupportFile' assets/model-index.js
          grep -q 'supportFiles' assets/model-index.js
          grep -q 'MODEL_REMOTE_TOKEN' runtime/local_bridge.py
          grep -q 'runtimeToken' assets/app.js
          grep -q 'videoWorkspace' index.html
          grep -q 'generateVideo' assets/app.js
          test -f runtime/workflows/video_wan2_2_5B_ti2v.json
          test -f runtime/workflows/video_hunyuan_video_1.5_720p_t2v.json
          grep -q 'loadModelRegistry' assets/drive-client.js
          grep -q 'flattenPackages' assets/model-index.js

  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell scripts
        shell: powershell
        run: |
          $files = @(
            "runtime\launch_model.ps1",
            "runtime\start_bridge.ps1",
            "runtime\install_runtime.ps1",
            "runtime\background.ps1",
            "runtime\remote_nvidia.ps1",
            "runtime\uninstall_runtime.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object {
                Write-Error ("{0}:{1}:{2} {3} :: {4}" -f $file, $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message, $_.Extent.Text)
              }
              exit 1
            }
          }

      - name: Exercise launcher process arguments
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File runtime\launch_model.ps1 -SelfTest

      - name: Exercise one-time installer
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File runtime\install_runtime.ps1 -SelfTest

      - name: Exercise tray runtime script
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File runtime\background.ps1 -SelfTest

      - name: Verify CMD entry points
        shell: cmd
        run: |
          if not exist runtime\Model.cmd exit /b 1
          if not exist runtime\Install.cmd exit /b 1
          if not exist runtime\Uninstall.cmd exit /b 1
          if not exist runtime\Enable-Remote-Nvidia.cmd exit /b 1
          if not exist runtime\Disable-Remote-Nvidia.cmd exit /b 1
          findstr /C:"launch_model.ps1" runtime\Model.cmd >nul
          findstr /C:"install_runtime.ps1" runtime\Install.cmd >nul
          findstr /C:"uninstall_runtime.ps1" runtime\Uninstall.cmd >nul
          findstr /C:"remote_nvidia.ps1" runtime\Enable-Remote-Nvidia.cmd >nul
          findstr /C:"remote_nvidia.ps1" runtime\Disable-Remote-Nvidia.cmd >nul

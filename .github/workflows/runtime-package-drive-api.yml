name: runtime-package-web
on:
  push:
    branches: [main, feat/runtime-package-main]
  pull_request:
    branches: [main, feat/model-release-v017-20260927]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: runtime-package-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source contracts, persistent activation and cache recovery
        run: python -m unittest discover -s tests -v
      - name: OAuth isolation and model classification
        run: |
          node tests/test_oauth_sessions.mjs
          node tests/test_model_index.js
          node tests/test_model_capabilities.js
      - name: Checksum-verified official CPU engine
        run: python -m tools.prepare_llama
      - name: Build and smoke-test candidate EXE with matching worker files
        shell: powershell
        run: ./tools/build_candidate.ps1
      - name: Parse launchers and validate installation without starting models
        shell: powershell
        run: |
          foreach ($file in (Get-ChildItem runtime\*.ps1) + (Get-ChildItem tools\*.ps1)) {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | Write-Error; exit 1 }
          }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File runtime\launch_model.ps1 -SelfTest
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File runtime\install_runtime.ps1 -SelfTest
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File runtime\background.ps1 -SelfTest
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File runtime\remote_nvidia.ps1 -SelfTest
          $oldLocal=$env:LOCALAPPDATA
          try {
            $env:LOCALAPPDATA="$env:RUNNER_TEMP\model-fresh-install"
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File runtime\install_runtime.ps1 -NoStart -CacheRoot "$env:RUNNER_TEMP\model-fresh-cache"
            if ($LASTEXITCODE -ne 0) { throw 'Fresh install failed' }
            $cfg=Get-Content "$env:LOCALAPPDATA\JvustModel\runtime.json" -Raw | ConvertFrom-Json
            if (-not (Test-Path -LiteralPath $cfg.llamaServerPath)) { throw 'CPU engine missing' }
            if (-not (Test-Path "$env:LOCALAPPDATA\JvustModel\app\ModelRuntime.exe")) { throw 'Runtime missing' }
          } finally {
            Remove-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name JvustModelRuntime -ErrorAction SilentlyContinue
            $env:LOCALAPPDATA=$oldLocal
          }
      - name: Read-only public OAuth probe (optional API source)
        run: python -m tools.probe_oauth_public
      - name: Assemble matching source and binary; no model weights
        shell: powershell
        run: |
          $root='Model-Runtime'
          New-Item -ItemType Directory -Force $root | Out-Null
          foreach ($folder in @('runtime','assets','docs','notebooks','governance','tests','tools','workers')) { Copy-Item -Recurse -Force $folder "$root\$folder" }
          foreach ($file in @('README.md','MODEL_ENABLEMENT_PLAN.md','index.html','sw.js','Run-Model-0.19.cmd')) { Copy-Item -Force $file "$root\$file" }
          Copy-Item -Recurse qa-evidence "$root\qa-evidence"
          Get-ChildItem $root -Directory -Recurse -Filter __pycache__ | Remove-Item -Recurse -Force
          Get-ChildItem $root -File -Recurse | Where-Object { $_.Extension -in @('.ttf','.otf','.woff','.woff2') } | Remove-Item -Force
          Get-FileHash "$root\runtime\ModelRuntime.exe" -Algorithm SHA256 | Format-List | Out-File "$root\EXE_SHA256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: Model-0.19-Activation-${{ github.sha }}
          path: Model-Runtime/
          if-no-files-found: error
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - name: Existing site and new activation lifecycle UI
        run: |
          python -m tools.check_browser
          python -m tools.check_desktop_browser
          CHROMIUM_PATH=$(python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()") python -m tools.check_activation_browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Model-browser-${{ github.sha }}
          path: qa-evidence/
          if-no-files-found: warn
  native-cpu:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        model: [got_ocr2, chronos_2, timesfm_2_0_500m]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install huggingface_hub==0.34.4 Pillow==11.3.0
      - name: Actual CPU inference, separate from mocked lifecycle tests
        env:
          HF_HUB_DISABLE_XET: '1'
        run: python -m tools.smoke_native_models --model ${{ matrix.model }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Model-native-${{ matrix.model }}-${{ github.sha }}
          path: |
            qa-evidence/
            ${{ runner.temp }}/model-native-smoke/${{ matrix.model }}/environments/**/setup.log
          if-no-files-found: warn
  gguf-cpu:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install huggingface_hub==0.34.4
      - run: python -m tools.prepare_llama
      - name: Actual chat, embedding, rerank and cold/warm cache CPU inference
        env:
          HF_HUB_DISABLE_XET: '1'
        run: |
          python -m tools.smoke_gguf_models
          python -m tools.smoke_desktop_gguf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Model-GGUF-real-${{ github.sha }}
          path: qa-evidence/
          if-no-files-found: warn

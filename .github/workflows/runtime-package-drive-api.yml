name: desktop-source-staging-apply
on:
  push:
    branches: [work/model-drive-desktop-20260927]
    paths: [.github/desktop-apply.trigger]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/work/model-drive-desktop-20260927'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/model-drive-desktop-20260927
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify fixed-base patch and prepare final tracked source
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, subprocess
          from pathlib import Path
          baseline = '5216d01f2c7829b30b9a2bedbed7d1fec523c927'
          subprocess.run(['git', 'merge-base', '--is-ancestor', baseline, 'HEAD'], check=True)
          archive = Path('.github/desktop-feature.patch.gz.b64')
          encoded = archive.read_text().strip()
          # Correct explicitly identified transport transcription errors; the entire
          # decoded patch must still match the independently recorded SHA256.
          for old, new in [('MOXHH7Tev','MOXH7Tev'), ('TPnvfL6BE','TPnvf6BE'), ('tadsyBktAm','tadsyB6Am'), ('EvvrFF19/r','EvvrF19/r'), ('QXut1nN4t','QXut1n4t'), ('XlQ3H9tt5','XlQ3H9t5'), ('JgXdOXVV3','JgXdOXV3')]:
              encoded = encoded.replace(old, new)
          raw = gzip.decompress(base64.b64decode(encoded, validate=True))
          if hashlib.sha256(raw).hexdigest() != 'e9690d99bcd3cdf991e449a6153a94c1271450cf569358ce1693dcf4aa7c48e7':
              raise RuntimeError('Patch integrity check failed; nothing applied')
          patch = Path('.github/desktop-feature.patch')
          patch.write_bytes(raw)
          workflow = Path('.github/workflows/runtime-package-drive-api.yml')
          workflow.write_bytes(subprocess.check_output(['git','show',baseline+':'+workflow.as_posix()]))
          subprocess.run(['git','apply','--check',str(patch)], check=True)
          subprocess.run(['git','apply',str(patch)], check=True)
          text = workflow.read_text()
          replacements = [
              ('[int]$health.version -ne 17', '[int]$health.version -ne 18'),
              ('[int]$runtime.runtime_version -ne 17', '[int]$runtime.runtime_version -ne 18'),
              ('@{ version = 17;', '@{ version = 18;'),
              ('Model-0.17-RC-', 'Model-0.18-Desktop-'),
              ('run: python -m tools.check_browser', 'run: |\n          python -m tools.check_browser\n          python -m tools.check_desktop_browser'),
              ('run: python -m tools.smoke_gguf_models', 'run: |\n          python -m tools.smoke_gguf_models\n          python -m tools.smoke_desktop_gguf'),
          ]
          for before, after in replacements:
              if text.count(before) != 1:
                  raise RuntimeError('Unexpected workflow contract: '+before)
              text = text.replace(before, after)
          needle = '            New-Item -ItemType Directory -Force qa-evidence | Out-Null'
          if text.count(needle) != 1: raise RuntimeError('Unexpected package evidence block')
          text = text.replace(needle, '            $desktop = Invoke-RestMethod "http://127.0.0.1:8765/v1/desktop/status" -TimeoutSec 5\n            if (-not $desktop.read_only -or -not $desktop.instance_id) { throw "Desktop source endpoint missing" }\n'+needle)
          workflow.write_text(text, encoding='utf-8')
          archive.unlink(); patch.unlink(); Path('.github/desktop-apply.trigger').unlink()
          print('Verified patch applied; temporary staging files removed; normal package workflow restored.')
          PY
      - name: Validate final source before committing
        env:
          MODEL_CACHE_ROOT: ${{ runner.temp }}/model-source-test-cache
          MODEL_DESKTOP_CONFIG: ${{ runner.temp }}/model-source-test-settings.json
        run: |
          python -m unittest discover -s tests -q
          node tests/test_model_index.js
          node tests/test_model_capabilities.js
          node tests/test_oauth_sessions.mjs
          for file in assets/*.js; do node --check "$file"; done
      - name: Commit only to the dedicated staging branch
        run: |
          test "${GITHUB_REF}" = "refs/heads/work/model-drive-desktop-20260927"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: integrate optional read-only Drive Desktop source and acceptance tests'
          git push origin HEAD:refs/heads/work/model-drive-desktop-20260927
          git rev-parse HEAD

name: runtime-package-web

on:
  push:
    branches:
      - main
      - feat/runtime-package-main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build standalone Runtime EXE
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check pyinstaller py7zr
          python -m PyInstaller --onefile --name ModelRuntime --paths runtime --collect-all py7zr --add-data "runtime\workflows;workflows" --add-data "runtime\edit_worker.py;." runtime\local_bridge.py
          Copy-Item -Force dist\ModelRuntime.exe runtime\ModelRuntime.exe

      - name: Smoke test standalone Runtime EXE
        shell: powershell
        run: |
          $env:LLAMA_SERVER_PATH = "missing-llama-server.exe"
          $env:MODEL_CACHE_ROOT = "$env:RUNNER_TEMP\model-cache"
          $env:MODEL_BRIDGE_PORT = "8765"
          $env:MODEL_SERVER_PORT = "8080"
          $stdout = "$env:RUNNER_TEMP\runtime-stdout.log"
          $stderr = "$env:RUNNER_TEMP\runtime-stderr.log"
          $p = Start-Process -FilePath "runtime\ModelRuntime.exe" -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            $ok = $false
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 250
              if ($p.HasExited) {
                Get-Content $stderr -ErrorAction SilentlyContinue
                Get-Content $stdout -ErrorAction SilentlyContinue
                throw "ModelRuntime.exe exited during smoke test."
              }
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8765/health" -TimeoutSec 1
                if ($health.ok) {
                  $ok = $true
                  break
                }
              } catch {}
            }
            if (-not $ok) {
              throw "ModelRuntime.exe health check timed out."
            }
            $video = Invoke-RestMethod -Uri "http://127.0.0.1:8765/v1/video/status" -TimeoutSec 3
            if (-not $video.workflow_resources_ready) {
              throw "Packaged video workflow resources are missing."
            }
            if (-not $video.archive_support) {
              throw "Packaged Runtime is missing py7zr archive support."
            }
            if (($video.supported_adapters | Measure-Object).Count -lt 2) {
              throw "Expected Wan and Hunyuan video adapters in packaged Runtime."
            }
            $image = Invoke-RestMethod -Uri "http://127.0.0.1:8765/v1/image/status" -TimeoutSec 3
            if (($image.supported_adapters | Measure-Object).Count -lt 3) {
              throw "Expected Pony, Qwen Image and FLUX.2 image adapters in packaged Runtime."
            }
            $tasks = Invoke-RestMethod -Uri "http://127.0.0.1:8765/v1/tasks/status" -TimeoutSec 3
            if (($tasks.supported_adapters | Measure-Object).Count -lt 2) {
              throw "Expected Qwen embedding and reranker task adapters."
            }
            if ([int]$tasks.port -ne 8091) {
              throw "Expected dedicated task llama-server port 8091."
            }
            $packageState = Invoke-RestMethod -Uri "http://127.0.0.1:8765/v1/packages/status" -TimeoutSec 3
            if ($packageState.phase -ne "idle") {
              throw "Package materializer should start idle."
            }
            $runtime = Invoke-RestMethod -Uri "http://127.0.0.1:8765/v1/runtime" -TimeoutSec 3
            if ([int]$runtime.runtime_version -lt 17) {
              throw "Expected Runtime v0.17 reference editing and video lifecycle API."
            }
            $edit = Invoke-RestMethod -Uri "http://127.0.0.1:8765/v1/edit/status" -TimeoutSec 3
            if ($edit.adapter -ne "qwen_image_edit_2511" -or $edit.phase -ne "idle") {
              throw "Expected idle Qwen 2511 edit adapter in packaged Runtime."
            }
            if ($runtime.remote_auth_required) {
              throw "Packaged Runtime should not require a remote token by default."
            }
            if ($null -eq $runtime.hardware.managed_comfy_supported) {
              throw "Runtime hardware gate is missing."
            }
            if ($null -eq $runtime.hardware.memory.available_bytes) {
              throw "Runtime memory preflight is missing."
            }
            if ($null -eq $runtime.hardware.cache_disk.free_bytes) {
              throw "Runtime cache disk preflight is missing."
            }
            $hardware = Invoke-RestMethod -Uri "http://127.0.0.1:8765/v1/hardware" -TimeoutSec 3
            if (-not $hardware.ok) {
              throw "Runtime hardware endpoint failed."
            }
            if ($null -eq $hardware.hardware.gpu.nvidia_smi) {
              throw "Runtime NVIDIA probe result is missing."
            }
            $capabilities = Invoke-RestMethod -Uri "http://127.0.0.1:8765/v1/models/capabilities" -TimeoutSec 3
            if (($capabilities.models | Measure-Object).Count -ne 28) {
              throw "Packaged Runtime is missing the 28-model capability registry including 2511."
            }
          }
          finally {
            if ($p -and -not $p.HasExited) {
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            }
          }


      - name: Parse runtime scripts
        shell: powershell
        run: |
          $files = @(
            "runtime\launch_model.ps1",
            "runtime\install_runtime.ps1",
            "runtime\background.ps1",
            "runtime\remote_nvidia.ps1",
            "runtime\uninstall_runtime.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object {
                Write-Error ("{0}:{1}:{2} {3} :: {4}" -f $file, $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message, $_.Extent.Text)
              }
              exit 1
            }
          }

      - name: Exercise runtime scripts
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File runtime\launch_model.ps1 -SelfTest
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File runtime\install_runtime.ps1 -SelfTest
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File runtime\background.ps1 -SelfTest
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File runtime\remote_nvidia.ps1 -SelfTest
          if (-not (Test-Path -LiteralPath "runtime\ModelRuntime.exe" -PathType Leaf)) { throw "ModelRuntime.exe missing after build." }

      - name: Assemble runtime package
        shell: powershell
        run: |
          $root = "Model-Runtime"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Copy-Item -Recurse -Force runtime "$root\runtime"
          Copy-Item -Force README.md "$root\README.md"
          Copy-Item -Force index.html "$root\index.html"
          Copy-Item -Recurse -Force assets "$root\assets"
          Copy-Item -Recurse -Force docs "$root\docs"
          Copy-Item -Force sw.js "$root\sw.js"

      - name: Upload runtime package
        uses: actions/upload-artifact@v4
        with:
          name: Model-Web-Runtime-${{ github.sha }}
          path: Model-Runtime/
          if-no-files-found: error
